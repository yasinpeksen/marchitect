# Supabase CLI config for the optional LOCAL stack (`npx supabase start`).
# Cloud projects ignore this file; apply supabase/migrations with `docker compose run --rm migrate`.
project_id = "markhitect"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
# Catches auth emails (confirmation / password reset) at http://localhost:54324
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/reset"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Google sign-in: set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in the shell before `supabase start`.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[analytics]
enabled = false
