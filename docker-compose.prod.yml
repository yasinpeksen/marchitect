# Production-style overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Run behind a TLS-terminating reverse proxy; do not publish Redis.
services:
  redis:
    restart: always
    ports: !reset []
    deploy: { resources: { limits: { memory: 512M } } }

  backend:
    restart: always
    environment:
      LOG_PRETTY: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy: { resources: { limits: { cpus: "1.0", memory: 768M } } }

  worker:
    restart: always
    environment:
      LOG_PRETTY: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy: { resources: { limits: { cpus: "2.0", memory: 1536M } } }

  frontend:
    restart: always
    deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }
