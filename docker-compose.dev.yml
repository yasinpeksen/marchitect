# Development overrides (hot reload):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"   # optional external access for debugging

  backend:
    build: { target: dev }
    command: ["npm", "run", "start:dev"]
    environment:
      NODE_ENV: development
      LOG_PRETTY: "true"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - ./supabase/migrations:/app/migrations:ro

  worker:
    build: { target: dev }
    command: ["npm", "run", "start:worker:dev"]
    environment:
      NODE_ENV: development
      LOG_PRETTY: "true"
    volumes:
      - ./backend:/app
      - worker-node-modules:/app/node_modules
      - ./supabase/migrations:/app/migrations:ro

  frontend:
    build: { target: dev }
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"   # reliable file watching on Docker Desktop / WSL bind mounts
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next

volumes:
  backend-node-modules: {}
  worker-node-modules: {}
  frontend-node-modules: {}
  frontend-next: {}
